<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Rift</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #090b10;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .top {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1px;

            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1.8px;
        }

        .logo .bolt {
            color: #3d7cff;
            font-size: 31px;
            line-height: 1;
            transform: skew(-8deg);
            margin: 0 -1px;
        }

        .profile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #151922;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
        }

        /* HERO */

        .hero {
            width: 100%;
            margin-top: 90px;
            text-align: center;
        }

        .hero h1 {
            font-size: 58px;
            line-height: 0.95;
            letter-spacing: -4px;
            font-weight: 900;
        }

        .hero p {
            margin-top: 20px;
            color: #3d7cff;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        /* BUTTON */

        .rift-button {
            width: 100%;
            margin-top: 34px;

            border: none;
            border-radius: 16px;

            padding: 18px 20px;

            background: #3d7cff;
            color: #ffffff;

            font-size: 17px;
            font-weight: 800;

            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .rift-button:active {
            transform: scale(0.97);
        }

        /* CARDS */

        .cards {
            width: 100%;
            margin-top: auto;
            padding-top: 70px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            min-height: 120px;

            border-radius: 18px;
            background: #14171f;

            padding: 18px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;

            text-align: left;
        }

        .card-icon {
            width: 38px;
            height: 38px;

            border-radius: 11px;
            background: #1b2130;

            display: flex;
            align-items: center;
            justify-content: center;

            color: #3d7cff;
            font-size: 19px;
            font-weight: 800;
        }

        .card strong {
            display: block;

            font-size: 15px;
            font-weight: 800;
        }

        .card p {
            margin-top: 5px;

            color: #777e8d;
            font-size: 12px;
        }

        /* SMALL SCREENS */

        @media (max-height: 700px) {

            .hero {
                margin-top: 55px;
            }

            .hero h1 {
                font-size: 50px;
            }

            .cards {
                padding-top: 45px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="top">

        <div class="logo">
            R
            <span class="bolt">ϟ</span>
            FT
        </div>

        <div class="profile">
            🌀
        </div>

    </div>


    <!-- HERO -->

    <div class="hero">

        <h1>
            Rift
        </h1>

        <p>
            Social Game.
        </p>

        <button class="rift-button" id="startButton">
            Войти в Rift →
        </button>

    </div>


    <!-- FEATURES -->

    <div class="cards">

        <div class="card">

            <div class="card-icon">
                ▶
            </div>

            <div>
                <strong>Играй</strong>
                <p>Заходи и участвуй</p>
            </div>

        </div>


        <div class="card">

            <div class="card-icon">
                ↗
            </div>

            <div>
                <strong>Прокачивайся</strong>
                <p>Развивай свой профиль</p>
            </div>

        </div>


        <div class="card">

            <div class="card-icon">
                VS
            </div>

            <div>
                <strong>Соревнуйся</strong>
                <p>Играй против других</p>
            </div>

        </div>


        <div class="card">

            <div class="card-icon">
                ★
            </div>

            <div>
                <strong>Выигрывай</strong>
                <p>Забирай свой результат</p>
            </div>

        </div>

    </div>

</div>


<script>
    const button = document.getElementById("startButton");

    button.addEventListener("click", () => {

        button.textContent = "Загрузка...";

        setTimeout(() => {
            button.textContent = "Войти в Rift →";
        }, 800);

    });
</script>

</body>
</html>
