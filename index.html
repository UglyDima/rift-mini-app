<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>Rift</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0d;
            color: #ffffff;
            font-family: Arial, Helvetica, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app {
            width: 100%;
            max-width: 520px;
            min-height: 100vh;
            margin: 0 auto;
            padding: 22px 18px;
            display: flex;
            flex-direction: column;
        }

        /* HEADER */

        .top {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: -1.8px;
        }

        .logo span {
            color: #ff3045;
        }

        .profile {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #17171b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        /* HERO */

        .hero {
            width: 100%;
            margin-top: 90px;
            text-align: center;
        }

        .hero h1 {
            font-size: 54px;
            line-height: 0.95;
            letter-spacing: -3.5px;
            font-weight: 900;
        }

        .hero h1 span {
            color: #ff3045;
        }

        .hero p {
            width: 100%;
            max-width: 300px;
            margin: 20px auto 0;
            color: #85858d;
            font-size: 16px;
            line-height: 1.45;
        }

        /* BUTTON */

        .rift-button {
            width: 100%;
            margin-top: 34px;
            border: none;
            border-radius: 16px;
            padding: 18px 20px;
            background: #ff3045;
            color: #ffffff;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .rift-button:active {
            transform: scale(0.97);
        }

        /* CARDS */

        .cards {
            width: 100%;
            margin-top: auto;
            padding-top: 70px;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .card {
            min-height: 125px;
            border-radius: 18px;
            background: #151519;
            padding: 18px;

            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: #202025;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 18px;
        }

        .card:last-child .card-icon {
            color: #ff3045;
        }

        .card strong {
            font-size: 15px;
            font-weight: 800;
        }

        .card p {
            margin-top: 4px;
            color: #77777f;
            font-size: 12px;
        }

        /* SMALL SCREENS */

        @media (max-height: 700px) {
            .hero {
                margin-top: 55px;
            }

            .hero h1 {
                font-size: 48px;
            }

            .cards {
                padding-top: 45px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <div class="top">
        <div class="logo">
            RIFT<span>.</span>
        </div>

        <div class="profile">
            👤
        </div>
    </div>


    <div class="hero">

        <h1>
            Это<br>
            <span>Rift.</span>
        </h1>

        <p>
            Социальная игра, где всё происходит между людьми.
        </p>

        <button class="rift-button" id="startButton">
            Войти в Rift →
        </button>

    </div>


    <div class="cards">

        <div class="card">

            <div class="card-icon">
                ✦
            </div>

            <div>
                <strong>Люди</strong>
                <p>Общайся и играй</p>
            </div>

        </div>


        <div class="card">

            <div class="card-icon">
                ⟡
            </div>

            <div>
                <strong>Игра</strong>
                <p>Смотри, что будет</p>
            </div>

        </div>

    </div>

</div>


<script>
    const button = document.getElementById("startButton");

    button.addEventListener("click", () => {
        button.textContent = "Загрузка...";
        
        setTimeout(() => {
            button.textContent = "Войти в Rift →";
        }, 800);
    });
</script>

</body>
</html>
