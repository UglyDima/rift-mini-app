<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rift</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #0b0b0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .app {
            min-height: 100vh;
            padding: 24px 18px;
            display: flex;
            flex-direction: column;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: -1.5px;
        }

        .status {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #19191d;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .hero {
            margin-top: 75px;
        }

        .hero h1 {
            font-size: 52px;
            line-height: 0.95;
            letter-spacing: -3px;
            max-width: 330px;
        }

        .hero h1 span {
            color: #b8ff00;
        }

        .hero p {
            margin-top: 18px;
            color: #8e8e96;
            font-size: 16px;
            line-height: 1.4;
            max-width: 290px;
        }

        .rift-button {
            margin-top: 34px;
            width: 100%;
            border: none;
            border-radius: 18px;
            padding: 18px 20px;
            background: #b8ff00;
            color: #090909;
            font-size: 17px;
            font-weight: 800;
            cursor: pointer;
        }

        .rift-button:active {
            transform: scale(0.98);
        }

        .cards {
            margin-top: auto;
            padding-top: 70px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .card {
            min-height: 105px;
            border-radius: 18px;
            background: #151519;
            padding: 16px;
        }

        .card .icon {
            font-size: 23px;
            margin-bottom: 18px;
        }

        .card strong {
            font-size: 14px;
        }

        .card p {
            color: #77777f;
            font-size: 12px;
            margin-top: 5px;
        }
    </style>
</head>

<body>

<div class="app">

    <div class="top">
        <div class="logo">RIFT</div>
        <div class="status">🌀</div>
    </div>

    <div class="hero">
        <h1>
            Здесь всё<br>
            немного <span>иначе.</span>
        </h1>

        <p>
            Заходи, выбирай свою сторону и смотри, куда приведёт следующий ход.
        </p>

        <button class="rift-button" id="startButton">
            Войти в Rift →
        </button>
    </div>

    <div class="cards">
        <div class="card">
            <div class="icon">⚡</div>
            <strong>Выбор</strong>
            <p>Решай сам</p>
        </div>

        <div class="card">
            <div class="icon">🌀</div>
            <strong>Rift</strong>
            <p>Твой расклад</p>
        </div>
    </div>

</div>

<script>
    const button = document.getElementById("startButton");

    button.addEventListener("click", () => {
        button.textContent = "Скоро 👀";
    });
</script>

</body>
</html>
